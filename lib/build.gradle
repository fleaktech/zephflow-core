plugins {
  id 'antlr'
  alias(libs.plugins.avro)
}

dependencies {
  api project(":api")

  implementation libs.commons.io
  implementation libs.commons.cli
  implementation libs.commons.csv
  implementation libs.aws.s3
  implementation libs.aws.kinesis
  implementation libs.aws.s3.transfer.manager

  implementation libs.aws.kinesis.client
  implementation libs.aws.dynamodb
  implementation libs.aws.cloudwatch
  implementation libs.aws.sqs

  implementation libs.kafka.clients
  implementation libs.clickhouse.client

  implementation libs.graalvm.polyglot
  runtimeOnly libs.graalvm.polyglot.python

  implementation libs.clickhouse.jdbc

  implementation(libs.hadoop.common) {
    exclude group: 'ch.qos.logback'
  }
  implementation(libs.hadoop.client) {
    exclude group: 'ch.qos.logback'
  }
  implementation(libs.hadoop.aws) {
    exclude group: 'software.amazon.awssdk', module: 'bundle'
    exclude group: 'ch.qos.logback'
  }

  implementation libs.delta.kernel.api
  implementation libs.delta.kernel.defaults

  implementation libs.databricks.sdk
  implementation libs.zerobus.ingest.sdk
  implementation libs.protobuf.java

  implementation libs.splunk

  implementation libs.gcs.storage
  implementation libs.gcs.pubsub

  implementation libs.jakarta.jms.api
  implementation libs.activemq.client.jakarta
  implementation libs.artemis.jakarta.client
  implementation libs.paho.mqttv5.client

  runtimeOnly libs.postgresql.driver
  runtimeOnly libs.mysql.connector
  runtimeOnly libs.mariadb.connector
  runtimeOnly libs.ojdbc.driver
  runtimeOnly libs.mssql.jdbc.driver

  testImplementation libs.h2.database
  implementation libs.angus.mail
  implementation(libs.azure.storage.blob) {
    exclude group: 'com.azure', module: 'azure-core-http-netty'
  }
  implementation libs.azure.core.http.okhttp
  // Event Hub connector. Follow the repo's Azure convention: drop the Netty HTTP transport
  // (heavily version-constrained in the root build) and rely on the shared okhttp client above.
  // The Event Hubs data path is AMQP; the excluded module only affects the HTTP control path.
  implementation(libs.azure.messaging.eventhubs) {
    exclude group: 'com.azure', module: 'azure-core-http-netty'
  }
  implementation(libs.azure.messaging.eventhubs.checkpointstore.blob) {
    exclude group: 'com.azure', module: 'azure-core-http-netty'
  }
  implementation(libs.azure.identity) {
    exclude group: 'com.azure', module: 'azure-core-http-netty'
  }
  implementation libs.sshj

  implementation platform(libs.chronicle.bom)
  implementation libs.chronicle.queue

  testImplementation libs.unboundid.ldapsdk
  testImplementation libs.testcontainers.clickhouse
  testImplementation libs.testcontainers.azure

  api libs.antlr4.runtime
  antlr libs.antlr4
}

// The antlr plugin makes `api` extend `antlr`, which would ship the ANTLR tool to consumers; only the runtime is needed.
configurations.api {
  setExtendsFrom(extendsFrom.findAll { it.name != 'antlr' })
}

configurations.all {
  exclude group: 'dnsjava', module: 'dnsjava'
}


generateGrammarSource {
  arguments << "-lib" << "src/main/antlr/io/fleak/zephflow/lib/antlr"
  arguments += ['-visitor', '-package', 'io.fleak.zephflow.lib.antlr']
  maxHeapSize = '64m'
  outputDirectory = project.layout.buildDirectory.dir("generated/sources/main/java").get().asFile
}

generateAvroJava {
  source('src/main/avro')
  outputDir = project.layout.buildDirectory.dir("generated/sources/main/java").get().asFile
}

tasks.named('spotlessJava') {
  mustRunAfter 'generateGrammarSource'
  mustRunAfter 'generateAvroJava'
}

tasks.named('test') {
  // Ordinary unit tests exclude golden; golden runs as its own task (see goldenTest below).
  useJUnitPlatform { excludeTags 'golden' }
  testLogging.showStandardStreams = true
  // Chronicle Queue memory-maps files via JDK internals; Java 17+ needs these opened/exported.
  jvmArgs += [
    '--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED',
    '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED',
    '--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED',
    '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
    '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
    '--add-opens', 'java.base/java.io=ALL-UNNAMED',
    '--add-opens', 'java.base/java.util=ALL-UNNAMED',
    '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
  ]
}

tasks.named('sourcesJar') {
  dependsOn 'generateGrammarSource'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Golden fixture tests run as their own task so CI can parallelise and the fast layer runs first.
tasks.register('goldenTest', Test) {
  description = 'Golden fixture tests (src/test/resources/golden/**)'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform { includeTags 'golden' }
  // pass -D flags from the command line into the forked test JVM
  ['golden.update', 'golden.filter', 'golden.dir'].each { k ->
    if (System.getProperty(k) != null) systemProperty k, System.getProperty(k)
  }
  outputs.upToDateWhen { false }   // fixtures are inputs; never skip
  testLogging { exceptionFormat 'full'; events 'failed' }
}

tasks.named('check') { dependsOn 'goldenTest' }