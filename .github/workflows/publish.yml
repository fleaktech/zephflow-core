name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ created ]
  # Manual run on a throwaway tag (v0.0.N-ghpverify.M) to check the GitHub Packages publish path.
  # It never reaches Maven Central or Docker Hub; delete the published versions and the tag afterwards.
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Run as a release candidate (only to check that the tag check rejects it)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
      packages: write
      id-token: write # Required for keyless signing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Important for nebula-release

      - name: Set up Oracle JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'oracle'

      - uses: gradle/actions/setup-gradle@v4

      - name: Seed test queue durations
        run: |
          mkdir -p lib/build/test-queue
          cp scripts/test-queue/durations.json lib/build/test-queue/durations.json

      - name: Build with Gradle
        run: ./gradlew build -PtestQueue=true -DtestForks=4

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        with:
          name: JUnit Tests
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          max-annotations: 5

      - name: Generate JaCoCo Report
        run: ./gradlew jacocoTestReport -PtestQueue=true -DtestForks=4

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Fail before anything is uploaded when the tag does not match how the release was marked:
      # a pre-release needs vX.Y.Z-rc.N, a full release needs vX.Y.Z. A manual run only accepts
      # v0.0.N-ghpverify.M, so a throwaway version always sorts below every real release.
      - name: Check the release tag
        id: tag
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT" = release ]; then
            tag="$RELEASE_TAG"
            if [ "$RELEASE_PRERELEASE" = true ]; then
              pattern='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
            else
              pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
            fi
          else
            if [ "$INPUT_PRERELEASE" = true ]; then
              echo "::error::A manual run publishes a full-release-shaped check version; run it with prerelease=false"
              exit 1
            fi
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::Run this workflow manually on a v0.0.N-ghpverify.M tag, not on $REF_TYPE $REF_NAME"
              exit 1
            fi
            tag="$REF_NAME"
            pattern='^v0\.0\.[0-9]+-ghpverify\.[0-9]+$'
          fi
          if ! [[ "$tag" =~ $pattern ]]; then
            echo "::error::Tag $tag does not match $pattern for this run"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Import GPG key for Maven Central publishing
      - name: Import GPG key
        if: github.event_name == 'release'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Build clistarter fat jar for releases
      - name: Build clistarter fat jar
        if: github.event_name == 'release'
        id: build_cli_jar
        run: |
          echo "Building clistarter fat jar for release ${{ github.event.release.tag_name }}..."
          ./gradlew clean :clistarter:shadowJar -Prelease.useLastTag=true

          # List the built artifacts
          echo "=== Built clistarter artifacts ==="
          ls -la clistarter/build/libs/

          # Find the fat jar
          CLI_JAR_FILE=$(find clistarter/build/libs/ -name "*-all.jar" -type f | head -1)
          if [ -z "$CLI_JAR_FILE" ]; then
            echo "ERROR: No clistarter fat jar found!"
            exit 1
          fi

          echo "cli_jar_path=$CLI_JAR_FILE" >> $GITHUB_OUTPUT
          echo "cli_jar_name=$(basename $CLI_JAR_FILE)" >> $GITHUB_OUTPUT
          echo "✅ Successfully built: $CLI_JAR_FILE"

      # Upload the clistarter fat jar to the existing GitHub release
      - name: Upload Fat JAR to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.build_cli_jar.outputs.cli_jar_path }}
          tag_name: ${{ github.event.release.tag_name }}

      # Every release (RC and full) and every manual check run goes to GitHub Packages first, so a
      # Maven Central refusal still leaves the version usable for internal projects. Modules already
      # there are skipped, which keeps a re-run of a half-failed release working.
      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: .github/scripts/publish-to-github-packages.sh
        env:
          GRADLE_OPTS: "-Xmx6g -Xms3g -XX:MaxMetaspaceSize=512m"
          VERSION: ${{ steps.tag.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish Release to Maven Central. `clean` runs on its own: in one invocation it
      # deletes build/jreleaser/trace.log after JReleaser has already opened it.
      # Only the staging repository is published here (GitHub Packages already has the version),
      # and only runner, lib and api: clistarter has a publication too but must not reach Central.
      - name: Publish Release to Maven Central
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: |
          ./gradlew clean
          ./gradlew -Prelease.useLastTag=true \
            runner:publishAllPublicationsToMavenRepository \
            lib:publishAllPublicationsToMavenRepository \
            api:publishAllPublicationsToMavenRepository \
            jreleaserDeploy --stacktrace
        env:
          GRADLE_OPTS: "-Xmx6g -Xms3g -XX:MaxMetaspaceSize=512m"
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual check run: stage what the Maven Central step would upload, without uploading it,
      # and fail if anything other than runner, lib and api ends up in the staging directory.
      - name: Stage Maven Central artifacts without uploading
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew -Prelease.useLastTag=true \
            runner:publishAllPublicationsToMavenRepository \
            lib:publishAllPublicationsToMavenRepository \
            api:publishAllPublicationsToMavenRepository --stacktrace
          staged=$(ls build/staging-deploy/io/fleak/zephflow | sort | tr '\n' ' ')
          echo "Staged modules: $staged"
          if [ "$staged" != "api lib runner " ]; then
            echo "::error::Expected only api, lib and runner in build/staging-deploy, found: $staged"
            exit 1
          fi
        env:
          GRADLE_OPTS: "-Xmx6g -Xms3g -XX:MaxMetaspaceSize=512m"

      # JReleaser drops the body of a 4xx from the Central Portal, so ask the portal
      # directly: the deployment's state and errors, then the publish response itself.
      - name: Query the Central Portal for the failed deployment
        if: failure() && github.event_name == 'release' && !github.event.release.prerelease
        env:
          PORTAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          set +x
          deployment_id=$(sed -n 's/^deployMavenCentralSonatypeDeploymentId=//p' build/jreleaser/output.properties)
          if [ -z "$deployment_id" ]; then
            echo "No deployment id in build/jreleaser/output.properties; the failure happened before the upload."
            exit 0
          fi
          token=$(printf '%s:%s' "$PORTAL_USERNAME" "$PORTAL_PASSWORD" | base64 -w0)
          echo "::group::Deployment status for $deployment_id"
          curl -sS -X POST -H "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id"
          echo
          echo "::endgroup::"
          echo "::group::Publish response for $deployment_id"
          curl -sS -i -X POST -H "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$deployment_id"
          echo
          echo "::endgroup::"

      # JReleaser reports portal errors as "Unexpected error" on the console; the HTTP
      # response is only in its trace log, so keep it when the publish fails.
      - name: Upload JReleaser trace log
        if: failure() && github.event_name == 'release' && !github.event.release.prerelease
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-trace
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
          if-no-files-found: warn
          retention-days: 14

      # Install cosign for attestation signing
      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v3.3.0
        with:
          cosign-release: 'v2.2.3'  # Specific version that avoids the TUF key issue

      # Set up QEMU for multi-architecture builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: github.event_name == 'release'

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: github.event_name == 'release'

      # Login to Docker Hub. DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are a Docker Hub personal access
      # token with push rights on fleak/zephflow-clistarter; when this step fails with
      # "incorrect username or password", regenerate the token and update DOCKERHUB_TOKEN.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: github.event_name == 'release'

      ##### CLISTARTER DOCKER IMAGE #####

      # Build the clistarter JAR with shadowJar
      - name: Build clistarter JAR
        if: github.event_name == 'release'
        run: ./gradlew :clistarter:shadowJar

      # Extract metadata for clistarter Docker
      - name: Extract clistarter Docker metadata
        if: github.event_name == 'release'
        id: meta-clistarter
        uses: docker/metadata-action@v6
        with:
          images: fleak/zephflow-clistarter
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      # Build and push clistarter Docker image with attestations
      - name: Build and push clistarter Docker image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: ./clistarter
          file: ./clistarter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-clistarter.outputs.tags }}
          labels: ${{ steps.meta-clistarter.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max  # Add provenance attestation
          sbom: true            # Add SBOM attestation
