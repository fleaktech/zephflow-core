name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ created ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
      id-token: write # Required for keyless signing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Important for nebula-release

      - name: Set up Oracle JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'oracle'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        with:
          name: JUnit Tests
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          max-annotations: 5

      - name: Generate JaCoCo Report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Import GPG key for Maven Central publishing
      - name: Import GPG key
        if: github.event_name == 'release'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Build clistarter fat jar for releases
      - name: Build clistarter fat jar
        if: github.event_name == 'release'
        id: build_cli_jar
        run: |
          echo "Building clistarter fat jar for release ${{ github.event.release.tag_name }}..."
          ./gradlew clean :clistarter:shadowJar -Prelease.useLastTag=true

          # List the built artifacts
          echo "=== Built clistarter artifacts ==="
          ls -la clistarter/build/libs/

          # Find the fat jar
          CLI_JAR_FILE=$(find clistarter/build/libs/ -name "*-all.jar" -type f | head -1)
          if [ -z "$CLI_JAR_FILE" ]; then
            echo "ERROR: No clistarter fat jar found!"
            exit 1
          fi

          echo "cli_jar_path=$CLI_JAR_FILE" >> $GITHUB_OUTPUT
          echo "cli_jar_name=$(basename $CLI_JAR_FILE)" >> $GITHUB_OUTPUT
          echo "✅ Successfully built: $CLI_JAR_FILE"

      # Upload the clistarter fat jar to the existing GitHub release
      - name: Upload Fat JAR to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.build_cli_jar.outputs.cli_jar_path }}
          tag_name: ${{ github.event.release.tag_name }}

      # Publish Release to Maven Central
      - name: Publish Release to Maven Central
        if: github.event_name == 'release'
        run: ./gradlew clean -Prelease.useLastTag=true runner:publish lib:publish api:publish jreleaserDeploy
        env:
          GRADLE_OPTS: "-Xmx6g -Xms3g -XX:MaxMetaspaceSize=512m"
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install cosign for attestation signing
      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v3.3.0
        with:
          cosign-release: 'v2.2.3'  # Specific version that avoids the TUF key issue

      # Set up QEMU for multi-architecture builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: github.event_name == 'release'

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: github.event_name == 'release'

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: github.event_name == 'release'

      ##### CLISTARTER DOCKER IMAGE #####

      # Build the clistarter JAR with shadowJar
      - name: Build clistarter JAR
        if: github.event_name == 'release'
        run: ./gradlew :clistarter:shadowJar

      # Extract metadata for clistarter Docker
      - name: Extract clistarter Docker metadata
        if: github.event_name == 'release'
        id: meta-clistarter
        uses: docker/metadata-action@v6
        with:
          images: fleak/zephflow-clistarter
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      # Build and push clistarter Docker image with attestations
      - name: Build and push clistarter Docker image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: ./clistarter
          file: ./clistarter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-clistarter.outputs.tags }}
          labels: ${{ steps.meta-clistarter.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max  # Add provenance attestation
          sbom: true            # Add SBOM attestation
