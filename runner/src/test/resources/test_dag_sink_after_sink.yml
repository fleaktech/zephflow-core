jobContext:
  otherProperties: {}
  metricTags:
    service: "default_service"
    env: "default_env"

dag:
  - id: "in"
    commandName: "stdin"
    config:
      decoding:
        compression: []
        format:
          type: "json"
          mode: "array"
    outputs:
      - "first_sink"

  - id: "first_sink"
    commandName: "stdout"
    config:
      encoding:
        format:
          type: "json"
          mode: "object"
    outputs:
      - "second_sink"

  - id: "second_sink"
    commandName: "stdout"
    config:
      encoding:
        format:
          type: "json"
          mode: "object"
