jobContext:
  otherProperties: {}
  metricTags:
    service: "default_service"
    env: "default_env"

dag:
  - id: "first_source"
    commandName: "stdin"
    config:
      encodingType: "JSON_ARRAY"
    outputs:
      - "out"

  - id: "second_source"
    commandName: "stdin"
    config:
      encodingType: "JSON_ARRAY"
    outputs:
      - "out"

  - id: "out"
    commandName: "stdout"
    config:
      encodingType: "JSON_OBJECT"
