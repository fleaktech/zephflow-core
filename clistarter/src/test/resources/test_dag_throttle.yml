jobContext:
  otherProperties:
  metricTags:
  dlqConfig:

dag:
  - id: "in"
    commandName: "stdin"
    config:
      decoding:
        compression: []
        format:
          type: "json"
          mode: "array"
    outputs:
      - "throttle"

  - id: "throttle"
    commandName: "throttle"
    config:
      keyExpression: 'concat($.host, ":", $.status)'
      numToAllow: 1
      periodSeconds: 3600
    outputs:
      - "out"

  - id: "out"
    commandName: "stdout"
    config:
      encoding:
        format:
          type: "json"
          mode: "object"
