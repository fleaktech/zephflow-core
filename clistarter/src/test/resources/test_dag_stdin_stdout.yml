jobContext:
  otherProperties: {}
  metricTags:
    service: "default_service"
    env: "default_env"

dag:
  - id: "in"
    commandName: "stdin"
    config:
      decoding:
        compression: []
        format:
          type: "json"
          mode: "array"
    outputs:
      - "out"

  - id: "out"
    commandName: "stdout"
    config:
      encoding:
        format:
          type: "json"
          mode: "object"
